<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRỊNH HD Ngân | Sketches</title>
    <!-- Favicon -->
    <link rel="icon" href="https://avatars.githubusercontent.com/u/103092148?v=4" type="image/x-icon" />
    <!-- Hide the page until style.css loads; its fade-in animation reveals it -->
    <style>body { opacity: 0; }</style>
    <!-- Karla font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap">
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Parallax Pixel Background Animation -->
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>
    <!-- End of Parallax Pixel Background Animation -->

    <a class="back-link" href="./">
      <i class="fas fa-arrow-left">&nbsp;</i>@thdngan
    </a>

    <div class="section-title">sketches</div>

    <div id="gallery"></div>

    <dialog id="lightbox" class="lightbox" tabindex="-1">
      <figure>
        <img alt="">
        <figcaption>
          <button class="lightbox-nav" data-step="-1" aria-label="Previous sketch"><i class="fas fa-chevron-left"></i></button>
          <span class="lightbox-caption"></span>
          <button class="lightbox-nav" data-step="1" aria-label="Next sketch"><i class="fas fa-chevron-right"></i></button>
        </figcaption>
      </figure>
      <button class="popup-close" aria-label="Close">&times;</button>
    </dialog>

    <!-- List of files in sketches/, regenerated by sync.sh -->
    <script src="sketches.js"></script>
    <!-- Hand-written captions -->
    <script src="sketches/captions.js"></script>
    <script>
      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = lightbox.querySelector('img');
      const caption = lightbox.querySelector('.lightbox-caption');
      let current = -1;
      let openedHere = false; // lightbox opened from the grid (vs. a shared #link), so closing can go back

      const src = name => 'sketches/' + encodeURIComponent(name);
      const captions = typeof CAPTIONS === 'undefined' ? {} : CAPTIONS;
      const title = name => captions[name] ?? name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');

      // Each tile links to #<file>; the hash decides which sketch the lightbox shows
      for (const name of SKETCHES) {
        const tile = document.createElement('a');
        tile.className = 'sketch';
        tile.href = '#' + encodeURIComponent(name);
        const img = document.createElement('img');
        img.src = src(name);
        img.alt = title(name);
        img.loading = 'lazy';
        tile.append(img);
        gallery.append(tile);
      }
      if (!SKETCHES.length) gallery.textContent = 'nothing here yet';
      if (SKETCHES.length < 2) lightbox.querySelectorAll('.lightbox-nav').forEach(b => b.hidden = true);

      function sync() {
        const i = SKETCHES.indexOf(decodeURIComponent(location.hash.slice(1)));
        if (i < 0) {
          if (lightbox.open) lightbox.close();
          return;
        }
        current = i;
        lightboxImg.src = src(SKETCHES[i]);
        lightboxImg.alt = caption.textContent = title(SKETCHES[i]);
        if (!lightbox.open) {
          lightbox.showModal();
          lightbox.focus(); // rather than the first button, which would show a focus ring
        }
      }

      function step(delta) {
        const next = SKETCHES[(current + delta + SKETCHES.length) % SKETCHES.length];
        location.replace('#' + encodeURIComponent(next)); // browse without piling up history
      }

      window.addEventListener('hashchange', () => {
        const wasOpen = lightbox.open;
        sync();
        if (!wasOpen && lightbox.open) openedHere = true;
      });

      // Closed via ×, Esc or the backdrop: drop the #hash too
      lightbox.addEventListener('close', () => {
        if (location.hash) {
          if (openedHere) history.back();
          else history.replaceState(null, '', location.pathname + location.search);
        }
        openedHere = false;
      });
      lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.close(); });
      lightbox.querySelector('.popup-close').addEventListener('click', () => lightbox.close());
      lightbox.querySelectorAll('.lightbox-nav').forEach(b => b.addEventListener('click', () => step(+b.dataset.step)));
      document.addEventListener('keydown', e => {
        if (!lightbox.open) return;
        if (e.key === 'ArrowLeft') step(-1);
        if (e.key === 'ArrowRight') step(1);
      });

      sync();
    </script>
  </body>
</html>
